[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "confluence-downloader"
version = "0.1.0"
description = "Download Confluence Data Center pages as PDFs for LLM context."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.15.0",
    # click is imported directly (ParameterSource); typer 0.26+ vendors click,
    # so its enums no longer match the external click package - stay below it.
    "click>=8,<9",
    "httpx>=0.27,<1",
    "textual>=8,<9",
    "typer>=0.12,<0.26",
    "weasyprint>=66,<67",
]

[project.scripts]
confluence-downloader = "confluence_downloader.cli:app"

[dependency-groups]
dev = [
    "pytest>=8,<9",
    "pytest-asyncio>=1,<2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.setuptools.packages.find]
where = ["src"]
